# The CI floor every DBHQ skill repository runs, defined once.
#
# Each skill repository calls this from its own Validate workflow, pinned by
# the full commit SHA, and Dependabot's github-actions updates move the pin:
#
#   jobs:
#     floor:
#       uses: dbhq-uk/.github/.github/workflows/skill-floor.yml@<full sha>
#
# Why it lives here and not in each repository: until 25 Sep 2026 every skill
# repository carried its own copy of these checks, and the copies drifted.
# One repository shipped a SKILL.md whose frontmatter was not valid YAML while
# its CI searched for "name:" with a regex. Three wrote $CLAUDE_SKILL_DIR
# without braces, which Claude Code does not substitute, and nothing looked.
# See https://github.com/dbhq-uk/.github/issues/4.
#
# What stays in each repository: its own test suite, and any rule that is
# about that skill rather than about every skill.
#
# Every check below runs even when an earlier one fails, so one run reports
# every problem rather than the first.

name: Skill floor

on:
  workflow_call:
    inputs:
      dashes:
        description: >-
          Fail on an em or en dash. This is the house rule and it is on by
          default. Turn it off only where the calling repository says why,
          in a comment beside the call.
        type: boolean
        required: false
        default: true
      dash-files:
        description: >-
          Space-separated git pathspecs the dash check reads. Markdown by
          default. A repository that also holds its code to the rule widens
          it, for example "*.md *.py *.sh".
        type: string
        required: false
        default: "*.md"

# The floor reads the repository and nothing else. A called workflow can only
# narrow the caller's token, so this holds whatever the caller grants.
permissions:
  contents: read

jobs:
  floor:
    name: Skill floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # PyYAML and ruff are for these checks only. No skill depends on them.
      - name: Install the checkers
        id: tools
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml ruff
          shellcheck --version | sed -n 2p
          ruff --version

      # No `version` in plugin.json, on purpose (24 Sep 2026). Claude Code only
      # updates an installed plugin when this field changes. It was never
      # bumped, so marketplace installs sat on old code for weeks. With no
      # version the commit is the version, and every merge reaches users.
      - name: plugin.json parses and carries no version
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json, pathlib, sys

          path = pathlib.Path(".claude-plugin/plugin.json")
          if not path.is_file():
              print(f"::error file={path}::{path} is missing")
              sys.exit(1)
          try:
              manifest = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as err:
              print(f"::error file={path},line={err.lineno}::{path} is not valid JSON: {err.msg}")
              sys.exit(1)
          if not isinstance(manifest, dict):
              print(f"::error file={path}::{path} is not a JSON object")
              sys.exit(1)
          if "version" in manifest:
              print(f"::error file={path}::{path} carries a version. Remove it: "
                    "Claude Code only updates an install when the version changes, "
                    "so a pinned version strands every install on old code.")
              sys.exit(1)
          print(f"{path} parses and carries no version")
          PY

      # A real YAML parse, not a search for "name:". An unquoted ": " inside a
      # description leaves both keys in place and makes the block invalid
      # YAML. Claude Code tolerates that; Codex skips the skill
      # (openai/codex#8609). A duplicate key is refused too, because
      # yaml.safe_load quietly keeps the last one. And a " #" in a plain
      # description starts a comment and cuts the description short with no
      # error, so that fails here rather than in somebody's session.
      - name: Every SKILL.md has frontmatter that parses as YAML
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          python - <<'PY'
          import pathlib, re, sys
          import yaml

          ok = True

          def fail(path, why, line=None):
              global ok
              where = f"file={path}" + (f",line={line}" if line else "")
              print(f"::error {where}::{path}: {why}")
              ok = False

          skills = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          if not skills:
              print("::error::no skills/*/SKILL.md found")
              sys.exit(1)

          for skill in skills:
              lines = skill.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0] != "---":
                  fail(skill, "the first line must be --- to open the frontmatter", 1)
                  continue
              try:
                  end = lines.index("---", 1)
              except ValueError:
                  fail(skill, "the frontmatter is never closed with a --- line", 1)
                  continue
              front = "\n".join(lines[1:end])

              try:
                  meta = yaml.safe_load(front)
              except yaml.YAMLError as err:
                  mark = getattr(err, "problem_mark", None)
                  fail(skill, f"frontmatter is not valid YAML: {err}".replace("\n", " "),
                       mark.line + 2 if mark else 1)
                  continue
              if not isinstance(meta, dict):
                  fail(skill, "frontmatter is not a mapping", 1)
                  continue

              root = yaml.compose(front, Loader=yaml.SafeLoader)
              seen = set()
              for key, value in root.value:
                  if not isinstance(key, yaml.ScalarNode):
                      fail(skill, "every frontmatter key must be a plain string", key.start_mark.line + 2)
                      continue
                  if key.value in seen:
                      fail(skill, f"duplicate key {key.value!r}", key.start_mark.line + 2)
                  seen.add(key.value)
                  if (key.value == "description" and isinstance(value, yaml.ScalarNode)
                          and value.style is None):
                      after = front.splitlines()[value.end_mark.line][value.end_mark.column:]
                      if after.strip().startswith("#"):
                          fail(skill, "a ' #' in the description starts a YAML comment and "
                                      "cuts it short. Quote the description.",
                               value.end_mark.line + 2)

              name, directory = meta.get("name"), skill.parent.name
              if name != directory:
                  fail(skill, f"name is {name!r} but the directory is {directory!r}", 1)
              elif not re.fullmatch(r"[a-z0-9-]{1,64}", name):
                  fail(skill, "name must be lowercase letters, digits and hyphens, at most 64", 1)

              description = meta.get("description")
              if not isinstance(description, str) or not description.strip():
                  fail(skill, "description is missing or empty", 1)
              elif len(description) > 1024:
                  fail(skill, f"description is {len(description)} characters, over the 1024 limit", 1)

          if ok:
              print(f"{len(skills)} SKILL.md file(s) OK")
          sys.exit(0 if ok else 1)
          PY

      # Claude Code substitutes only the braced ${CLAUDE_SKILL_DIR} and
      # ${CLAUDE_PLUGIN_ROOT} in skill content. The unbraced form is left for
      # the shell, where neither is set, so every documented command runs as
      # /scripts/... and fails. Scoped to skills/**/*.md on purpose: the
      # install-codex.sh scripts match the unbraced form deliberately.
      - name: Skill paths use the braced form Claude Code substitutes
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          python - <<'PY'
          import pathlib, re, sys

          unbraced = re.compile(r"\$(CLAUDE_SKILL_DIR|CLAUDE_PLUGIN_ROOT)\b")
          ok = True
          for path in sorted(pathlib.Path("skills").rglob("*.md")):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  for match in unbraced.finditer(line):
                      # Built by concatenation: a dollar sign followed by two
                      # braces would open an Actions expression in this file.
                      var = match.group(1)
                      braced = "${" + var + "}"
                      print(f"::error file={path},line={number}::write {braced} with braces. "
                            f"Claude Code does not substitute ${var}.")
                      ok = False
          if ok:
              print("Every skill path is braced")
          sys.exit(0 if ok else 1)
          PY

      - name: Every shell script parses
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          fail=0
          count=0
          while IFS= read -r -d '' script; do
            count=$((count + 1))
            if ! bash -n "$script"; then
              echo "::error file=$script::$script does not parse"
              fail=1
            fi
          done < <(git ls-files -z -- '*.sh')
          echo "$count shell script(s) checked"
          exit "$fail"

      # -S warning, not the default: `info` and `style` fire on idioms these
      # scripts use deliberately. -x follows `# shellcheck source=` directives
      # into the files they name, such as a shared _common.sh.
      - name: shellcheck
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          git ls-files -z -- '*.sh' | xargs -0 -r shellcheck -S warning -x
          echo "shellcheck clean"

      # A deliberately narrow selection. E9 is syntax errors and F is the
      # pyflakes set: undefined names, unused imports, f-strings with no
      # placeholders. Those are bugs. The full default selection flags import
      # order and whitespace, which would mean reformatting thousands of lines
      # to buy a gate that catches less. A repository that wants more, such as
      # garmin and imager, runs its own full ruff beside this.
      - name: ruff (syntax errors and pyflakes)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          if [ -z "$(git ls-files -- '*.py')" ]; then
            echo "No Python in this repository"
            exit 0
          fi
          ruff check --select E9,F --output-format=github .

      # House style is a plain hyphen. A blockquoted markdown line is exempt,
      # so a document can quote somebody else's prose verbatim: verve's worked
      # examples quote machine-written passages, dashes and all.
      - name: No em or en dashes
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && inputs.dashes }}
        env:
          DASH_FILES: ${{ inputs.dash-files }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys

          pathspecs = os.environ["DASH_FILES"].split()
          files = subprocess.run(["git", "ls-files", "-z", "--", *pathspecs],
                                 capture_output=True, text=True, check=True).stdout.split("\0")
          dashes = {"\u2014": "em dash", "\u2013": "en dash"}
          quoted = re.compile(r"\s*>")
          ok = True
          for path in filter(None, files):
              markdown = path.endswith(".md")
              with open(path, encoding="utf-8") as handle:
                  for number, line in enumerate(handle, 1):
                      if markdown and quoted.match(line):
                          continue
                      for dash, label in dashes.items():
                          if dash in line:
                              print(f"::error file={path},line={number}::{label} in {path}. "
                                    "House style is a plain hyphen.")
                              ok = False
          if ok:
              print(f"No em or en dashes in {' '.join(pathspecs)}")
          sys.exit(0 if ok else 1)
          PY
